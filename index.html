<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Gun Island Migration Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  #map { height: 90vh; }
</style>
</head>

<body>

<h3>Human and Animal Migration in Gun Island</h3>
<div id="map"></div>

<script>
var map = L.map('map').setView([30, 40], 3);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
.addTo(map);

// Places
L.marker([21.9497, 89.1833]).addTo(map).bindPopup("Sundarbans");
L.marker([22.5726, 88.3639]).addTo(map).bindPopup("Kolkata");
L.marker([45.4408, 12.3155]).addTo(map).bindPopup("Venice");

// Human migration route
L.polyline([
  [21.9497, 89.1833],
  [22.5726, 88.3639],
  [34.5531, 18.0480],
  [45.4408, 12.3155]
], {color: 'blue'}).addTo(map);

// Animal migration route
L.polyline([
  [21.9497, 89.1833],
  [34.5531, 18.0480]
], {color: 'green'}).addTo(map);

</script>

</body>
</html>
L.marker([34.5531, 18.0480]).addTo(map)
.bindPopup("<b>Mediterranean Sea</b><br>Transit space where human and non-human migrations overlap under climate stress.");
